<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nomi{% endblock %}</title>
  <style>
    :root {
      --bg: #12141a;
      --card: #1c1f28;
      --border: #2c3040;
      --text: #e8eaf0;
      --muted: #9aa0b0;
      --accent: #4fc3a1;
      --accent-hover: #5fd4b2;
      --error: #e57373;
      --success: #4fc3a1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      width: 100%;
      max-width: 34rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      height: fit-content;
    }
    h1 { margin: 0 0 .25rem; font-size: 1.4rem; }
    p.subtitle { margin: 0 0 1.5rem; color: var(--muted); font-size: .9rem; }
    .hint { color: var(--muted); font-size: .8rem; margin-top: .3rem; }
    .flash { padding: .6rem .8rem; border-radius: 8px; margin-bottom: .5rem; font-size: .9rem; }
    .flash.success { background: rgba(79, 195, 161, .12); border: 1px solid var(--success); }
    .flash.error { background: rgba(229, 115, 115, .12); border: 1px solid var(--error); }
    .badge {
      display: inline-block;
      font-size: .75rem;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: .1rem .6rem;
      margin-bottom: 1rem;
    }
    .back-link {
      display: inline-block;
      color: var(--muted);
      text-decoration: none;
      font-size: .85rem;
      margin-bottom: 1rem;
    }
    .back-link:hover { color: var(--accent); }
    @media (max-width: 480px) {
      body { padding: 0; }
      .card {
        max-width: none;
        min-height: 100vh;
        border: none;
        border-radius: 0;
        padding: 1.25rem 1rem;
      }
    }
    {% block styles %}{% endblock %}
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
